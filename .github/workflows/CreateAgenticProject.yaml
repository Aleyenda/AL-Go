name: Create Agentic Project

run-name: "Create agentic project for [${{ inputs.targetRepository }}]"

on:
  workflow_dispatch:
    inputs:
      targetRepository:
        description: 'Repository to prepare for the agentic loop board (owner/name)'
        required: true
        default: 'microsoft/BCAppsCampAIRHack'
      projectOwner:
        description: 'Organization or user that will own the GitHub Project'
        required: true
        default: 'microsoft'
      projectTitle:
        description: 'Optional project title override'
        required: false
        default: ''
      sourceProjectId:
        description: 'Optional source ProjectV2 node ID to copy from'
        required: false
        default: ''
      createRepositoryLabels:
        type: boolean
        description: 'Create or update the recommended agentic loop labels on the target repository'
        required: false
        default: true
      seedDemoData:
        type: boolean
        description: 'Seed demo draft issues into the project without creating issues in the target repository'
        required: false
        default: false
      dryRun:
        type: boolean
        description: 'Validate inputs without creating the project'
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  CreateAgenticProject:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Harden Runner
        if: github.repository_owner == 'microsoft'
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Validate GhTokenWorkflow
        env:
          GH_TOKEN_WORKFLOW: ${{ secrets.GhTokenWorkflow }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN_WORKFLOW)) {
            throw "GhTokenWorkflow secret is required. Use either a classic PAT with project scope or the AL-Go GitHub App JSON format."
          }

      - name: Resolve GhTokenWorkflow auth
        id: ResolveAuth
        env:
          GH_TOKEN_WORKFLOW: ${{ secrets.GhTokenWorkflow }}
        run: |
          if ($env:GH_TOKEN_WORKFLOW.TrimStart().StartsWith('{')) {
            $auth = $env:GH_TOKEN_WORKFLOW | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($auth.GitHubAppClientId) -or [string]::IsNullOrWhiteSpace($auth.PrivateKey)) {
              throw "GhTokenWorkflow JSON must contain GitHubAppClientId and PrivateKey."
            }

            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "authMode=app"
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "appId=$($auth.GitHubAppClientId)"
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "privateKey<<EOF"
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value $auth.PrivateKey
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "EOF"
          }
          else {
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "authMode=token"
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "token=$env:GH_TOKEN_WORKFLOW"
          }

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate GitHub App token
        if: steps.ResolveAuth.outputs.authMode == 'app'
        id: AppToken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ steps.ResolveAuth.outputs.appId }}
          private-key: ${{ steps.ResolveAuth.outputs.privateKey }}
          owner: ${{ inputs.projectOwner }}

      - name: Bootstrap agentic project
        env:
          GH_TOKEN: ${{ steps.ResolveAuth.outputs.authMode == 'app' && steps.AppToken.outputs.token || steps.ResolveAuth.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.targetRepository }}
          PROJECT_OWNER: ${{ inputs.projectOwner }}
          PROJECT_TITLE: ${{ inputs.projectTitle }}
          SOURCE_PROJECT_ID: ${{ inputs.sourceProjectId }}
          CREATE_REPOSITORY_LABELS: ${{ inputs.createRepositoryLabels }}
          SEED_DEMO_DATA: ${{ inputs.seedDemoData }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          ./.github/CreateAgenticProject.ps1 `
            -TargetRepository $env:TARGET_REPOSITORY `
            -ProjectOwner $env:PROJECT_OWNER `
            -ProjectTitle $env:PROJECT_TITLE `
            -SourceProjectId $env:SOURCE_PROJECT_ID `
            -CreateRepositoryLabels:($env:CREATE_REPOSITORY_LABELS -eq 'true') `
            -SeedDemoData:($env:SEED_DEMO_DATA -eq 'true') `
            -DryRun:($env:DRY_RUN -eq 'true')
